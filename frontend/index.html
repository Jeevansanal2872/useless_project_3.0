<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bug Hunter - Catch the Rat!</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  </head>
  <body>
    <div id="error-log" style="color:red; z-index:9999; position:absolute; background:black; top:0; left:0; pointer-events:none;"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById("error-log").innerText += e.message + " at " + e.filename + ":" + e.lineno + "\n";
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById("error-log").innerText += "Unhandled Promise Rejection: " + e.reason + "\n";
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
